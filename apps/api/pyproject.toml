[project]
name = "ayman-portfolio-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3", "argon2-cffi>=23.1,<26", "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1", "email-validator>=2.2,<3", "resend>=2.4,<3", "cloudinary>=1.41,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1", "mypy>=1.13,<2"]
[project.scripts]
portfolio-admin = "app.cli:create_admin"
portfolio-seed = "app.seed:seed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
